<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel Admin - Anto's Barber</title>
<style>
:root{--g:#d4af37}*{box-sizing:border-box;font-family:system-ui,sans-serif}body{margin:0;background:#0a0a0a;color:#fff;padding:12px;max-width:760px;margin:auto}
h1,h2{color:var(--g)}h2{font-size:1.1rem;border-bottom:1px solid #333;padding-bottom:6px;margin-top:28px}
.box{background:#141414;border:1px solid #333;border-radius:10px;padding:12px;margin:10px 0}
label{display:block;font-size:.8rem;color:#aaa;margin:8px 0 3px}input,textarea{width:100%;padding:9px;background:#0a0a0a;border:1px solid #444;border-radius:6px;color:#fff;font-size:1rem}
button{background:var(--g);color:#000;border:0;border-radius:6px;padding:9px 14px;font-weight:700;margin:6px 6px 0 0}button.d{background:#7a1f1f;color:#fff}
img{max-width:110px;max-height:110px;border-radius:6px;display:block;margin:6px 0}
#bar{position:sticky;top:0;background:#0a0a0acc;padding:8px 0;z-index:9}#msg{font-size:.9rem;margin-left:6px}
</style></head><body>
<h1>Panel Admin</h1>
<div id="login" class="box" hidden><p style="font-size:.9rem;color:#aaa">Solo la primera vez. Después entra solo en este dispositivo.</p>
<label>Repositorio (usuario/repo)</label><input id="repo" placeholder="Webjoel90911/Tony-Barber-">
<label>Rama</label><input id="branch" value="main">
<label>Token de GitHub</label><input id="token" type="password" placeholder="github_pat_...">
<button onclick="login()">Entrar</button></div>
<div id="app" hidden><div id="bar"><button onclick="save()">💾 Guardar y publicar</button><button class="d" onclick="logout()">Salir</button><span id="msg"></span></div><div id="ed"></div></div>
<script>
let D,sha,cfg=JSON.parse(localStorage.cfg||'{}');
const $=s=>document.getElementById(s),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const say=t=>$('msg').textContent=t;
const gh=(p,m='GET',b)=>fetch(`https://api.github.com/repos/${cfg.repo}/contents/${p}`+(m=='GET'?'?ref='+cfg.branch+'&t='+Date.now():''),{method:m,headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'},body:b&&JSON.stringify({...b,branch:cfg.branch})}).then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.message);return j});
async function login(auto){if(!auto)cfg={repo:$('repo').value.trim(),branch:$('branch').value.trim()||'main',token:$('token').value.trim()};
try{const j=await gh('data.json');sha=j.sha;D=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))));localStorage.cfg=JSON.stringify(cfg);$('login').hidden=true;$('app').hidden=false;render()}catch(x){$('login').hidden=false;if(!auto)alert('No se pudo entrar: '+x.message)}}
function logout(){localStorage.removeItem('cfg');location.reload()}
if(cfg.token)login(true);else $('login').hidden=false;
async function save(){say('Guardando...');try{const j=await gh('data.json','PUT',{message:'Actualización desde panel admin',content:btoa(unescape(encodeURIComponent(JSON.stringify(D,null,2)))),sha});sha=j.content.sha;say('✅ Guardado. La web se actualiza en ~1 min.')}catch(x){say('❌ '+x.message)}}
const get=(p)=>p.split('.').reduce((o,k)=>o[k],D);
function set(p,v){const k=p.split('.'),l=k.pop();k.reduce((o,x)=>o[x],D)[l]=v}
const F=(l,p,t='input')=>{const v=get(p);return `<label>${l}</label>`+(t=='ta'?`<textarea rows="4" data-p="${p}" data-l="1">${esc(v.join('\n'))}</textarea>`:t=='area'?`<textarea rows="3" data-p="${p}">${esc(v)}</textarea>`:`<input data-p="${p}" value="${esc(v)}">`)};
const I=(l,p)=>`<label>${l}</label><img src="${esc(get(p))}"><input type="file" accept="image/*" data-i="${p}">`;
const X=(p)=>`<button class="d" onclick="del('${p}')">Eliminar</button>`;
function render(){const c='contact.',h='hero.';
$('ed').innerHTML=`<h2>Contacto</h2><div class="box">${F('WhatsApp (solo números, con 51)',c+'phone')}${F('Teléfono visible',c+'phoneText')}${F('Dirección',c+'address')}${F('TikTok (enlace)',c+'tiktok')}${F('Instagram (enlace)',c+'instagram')}${F('Facebook (enlace)',c+'facebook')}${F('Horario línea 1',c+'hours1')}${F('Horario línea 2',c+'hours2')}</div>
<h2>Portada</h2><div class="box">${F('Título',h+'title1')}${F('Título dorado',h+'title2')}${F('Texto',h+'text','area')}${I('Imagen',h+'image')}</div>
<h2>Banners y promociones</h2>${D.banners.map((b,i)=>`<div class="box">${I('Banner '+(i+1),'banners.'+i)}${X('banners.'+i)}</div>`).join('')}<button onclick="add('banners','')">+ Banner</button>
<h2>Servicios y precios</h2>${D.categories.map((k,a)=>`<div class="box">${F('Categoría','categories.'+a+'.name')}${k.items.map((i,b)=>{const q=`categories.${a}.items.${b}.`;return `<div class="box">${F('Servicio',q+'name')}${F('Precio (S/)',q+'price')}${F('Etiqueta (ej. VIP, vacío = ninguna)',q+'badge')}${F('Detalles (uno por línea)',q+'features','ta')}${X(q.slice(0,-1))}</div>`}).join('')}<button onclick="add('categories.${a}.items',{name:'Nuevo servicio',price:'0',badge:'',features:[]})">+ Servicio</button>${X('categories.'+a)}</div>`).join('')}<button onclick="add('categories',{name:'Nueva categoría',icon:'fa-star',items:[]})">+ Categoría</button>
<h2>Barberos</h2>${D.barbers.map((b,i)=>{const q='barbers.'+i+'.';return `<div class="box">${F('Nombre',q+'name')}${F('Cargo',q+'role')}${I('Foto',q+'photo')}${X('barbers.'+i)}</div>`}).join('')}<button onclick="add('barbers',{name:'Nombre',role:'Barbero',photo:'582212.jpg'})">+ Barbero</button>
<h2>Cupos disponibles</h2><p style="font-size:.85rem;color:#aaa">Por día, escribe las horas libres separadas por coma (ej. 09:00, 10:30, 15:00). Cuando se reserve una, bórrala de la lista. Si un día no aparece, la web muestra "Sin cupos".</p>${D.slots.map((s,i)=>`<div class="box"><label>Fecha</label><input type="date" data-p="slots.${i}.date" value="${esc(s.date)}"><label>Horas libres</label><input data-c="1" data-p="slots.${i}.times" value="${esc(s.times.join(', '))}">${X('slots.'+i)}</div>`).join('')}<button onclick="add('slots',{date:'',times:[]})">+ Día</button>
<h2>Galería</h2>${D.gallery.map((b,i)=>`<div class="box">${I('Foto '+(i+1),'gallery.'+i)}${X('gallery.'+i)}</div>`).join('')}<button onclick="add('gallery','')">+ Foto</button>`}
function add(p,v){get(p).push(v);render()}
function del(p){if(!confirm('¿Eliminar?'))return;const k=p.split('.'),i=k.pop();get(k.join('.')).splice(+i,1);render()}
$('ed').addEventListener('input',e=>{const t=e.target;if(t.dataset.p)set(t.dataset.p,t.dataset.c?t.value.split(',').map(s=>s.trim()).filter(Boolean):t.dataset.l?t.value.split('\n').map(s=>s.trim()).filter(Boolean):t.value)});
$('ed').addEventListener('change',async e=>{const t=e.target,f=t.files&&t.files[0];if(!f||!t.dataset.i)return;say('Subiendo foto...');
try{const b64=await new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(f)});
const path='img/'+Date.now()+'-'+f.name.replace(/[^\w.]/g,'_');await gh(path,'PUT',{message:'Foto subida desde panel',content:b64});
set(t.dataset.i,path);say('Foto subida. Pulsa Guardar.');render()}catch(x){say('❌ '+x.message)}});
</script></body></html>
